<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudTask v1.1</title>
  <style>
  :root {
    --primary: #6d28d9;
    --primary-dark: #5b21b6;
    --accent: #0f766e;
    --accent-dark: #115e59;
    --page-start: #f5f3ff;
    --page-end: #ecfeff;
    --ink: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --surface: #ffffff;
    --soft: #f8fafc;
    --info-bg: #f3e8ff;
    --info-ink: #5b21b6;
    --danger-bg: #fee2e2;
    --danger-ink: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 28px 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, var(--page-start), var(--page-end));
    color: var(--ink);
    font-family: "Segoe UI", Arial, sans-serif;
  }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid #c4b5fd;
    outline-offset: 2px;
  }
  .app {
    width: min(100%, 920px);
    overflow: hidden;
    background: var(--surface);
    border: 1px solid rgba(109, 40, 217, .08);
    border-radius: 22px;
    box-shadow: 0 18px 50px rgba(31, 41, 55, .12);
  }
  .header {
    padding: 30px 24px;
    text-align: center;
    color: white;
    background: linear-gradient(135deg, var(--primary-dark), var(--accent));
  }
  .header h1 { margin: 0; font-size: clamp(28px, 5vw, 36px); letter-spacing: .2px; }
  .header p { margin: 9px 0 0; color: rgba(255,255,255,.92); }
  .version {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 13px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px;
    background: rgba(255,255,255,.15);
    font-size: 13px;
    font-weight: 700;
  }
  .content { padding: 26px; }
  .input-group {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10px;
    margin-bottom: 20px;
  }
  input[type="text"], input[type="date"], select {
    width: 100%;
    min-width: 0;
    padding: 12px 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
  }
  input::placeholder { color: #9ca3af; }
  .primary-btn {
    border: 0;
    border-radius: 10px;
    padding: 12px 18px;
    background: var(--primary);
    color: #fff;
    font-weight: 700;
    transition: background .15s ease, transform .15s ease;
  }
  .primary-btn:hover { background: var(--primary-dark); }
  .primary-btn:active { transform: translateY(1px); }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filter-btn {
    border: 0;
    border-radius: 999px;
    padding: 9px 14px;
    background: #f3f4f6;
    color: #374151;
  }
  .filter-btn:hover { background: #e9e7ef; }
  .filter-btn.active { background: var(--accent); color: white; }
  .clear-btn {
    border: 0;
    border-radius: 999px;
    padding: 9px 14px;
    background: #fff7ed;
    color: #c2410c;
    font-weight: 700;
  }
  .clear-btn:hover { background: #ffedd5; }
  .task-list { list-style: none; margin: 0; padding: 0; }
  .task {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 10px;
    padding: 14px 15px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--soft);
  }
  .task-left { display: flex; align-items: flex-start; gap: 11px; min-width: 0; }
  .task-left input[type="checkbox"] { margin-top: 3px; accent-color: var(--accent); }
  .task-info { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .task-text { overflow-wrap: anywhere; line-height: 1.4; }
  .task.completed .task-text { color: #9ca3af; text-decoration: line-through; }
  .task.completed { opacity: .86; }
  .task.overdue { border-left: 5px solid #dc2626; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .priority, .date-badge, .overdue-badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .priority-baja { background: #dcfce7; color: #166534; }
  .priority-media { background: #fef3c7; color: #92400e; }
  .priority-alta { background: #fee2e2; color: #b91c1c; }
  .date-badge { background: #e0f2fe; color: #075985; }
  .overdue-badge { background: #fee2e2; color: #b91c1c; }
  .actions { display: flex; flex-shrink: 0; gap: 7px; }
  .edit-btn, .delete-btn {
    border: 0;
    border-radius: 8px;
    padding: 8px 11px;
    font-size: 13px;
    font-weight: 700;
  }
  .edit-btn { background: #e0f2fe; color: #0369a1; }
  .edit-btn:hover { background: #bae6fd; }
  .delete-btn { background: var(--danger-bg); color: var(--danger-ink); }
  .delete-btn:hover { background: #fecaca; }
  .empty { padding: 25px 12px; text-align: center; color: #9ca3af; }
  .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; margin-top: 22px; }
  .summary-card {
    padding: 14px 10px;
    border-radius: 12px;
    background: var(--info-bg);
    color: var(--info-ink);
    text-align: center;
  }
  .summary-card strong { display: block; margin-top: 5px; font-size: 25px; }
  footer {
    padding: 17px 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    text-align: center;
    font-size: 13px;
    line-height: 1.7;
  }
  .footer-name { font-weight: 700; color: #4b5563; }
  .control-panel {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 210px;
    gap: 10px;
    margin-bottom: 18px;
  }
  @media (max-width: 720px) {
    body { padding: 12px; align-items: flex-start; }
    .content { padding: 18px; }
    .input-group { grid-template-columns: 1fr; }
    .input-group .primary-btn { min-height: 44px; }
    .control-panel { grid-template-columns: 1fr; }
    .summary { grid-template-columns: 1fr; }
    .task { align-items: flex-start; flex-direction: column; }
    .actions { align-self: flex-end; }
  }
</style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>☁ CloudTask</h1>
      <p>Organiza tus tareas, alcanza tus metas.</p>
      <span class="version">Versión 1.1</span>
    </header>
    <section class="content">
      <div class="input-group">
        <input id="taskInput" type="text" placeholder="Escribe una nueva tarea..." aria-label="Nueva tarea" maxlength="200">
        <select id="prioritySelect" aria-label="Prioridad de la tarea">
          <option value="baja">Prioridad baja</option>
          <option value="media" selected>Prioridad media</option>
          <option value="alta">Prioridad alta</option>
        </select>
        <button id="addTaskBtn" class="primary-btn" type="button">Agregar tarea</button>
      </div>

      <div class="toolbar">
        <div class="filters" aria-label="Filtrar tareas">
          <button class="filter-btn active" data-filter="all" type="button">Todas</button>
          <button class="filter-btn" data-filter="pending" type="button">Pendientes</button>
          <button class="filter-btn" data-filter="completed" type="button">Completadas</button>
        </div>
        <button id="clearCompletedBtn" class="clear-btn" type="button">Eliminar completadas</button>
      </div>

      <ul id="taskList" class="task-list" aria-live="polite"></ul>
      <div class="summary">
        <div class="summary-card">Total de tareas<strong id="totalCount">0</strong></div>
        <div class="summary-card">Tareas pendientes<strong id="pendingCount">0</strong></div>
      </div>
    </section>
    <footer>
      CloudTask v1.1 · Práctica de Computación en la Nube<br>
      <span class="footer-name">Desarrollado por: José Antonio Espinales Gómez y Emilia Julexy Bailon Parraga</span>
    </footer>
  </main>
<script>
const taskInput = document.getElementById("taskInput");
const prioritySelect = document.getElementById("prioritySelect");
const addTaskBtn = document.getElementById("addTaskBtn");
const taskList = document.getElementById("taskList");
const pendingCount = document.getElementById("pendingCount");
const totalCount = document.getElementById("totalCount");
const clearCompletedBtn = document.getElementById("clearCompletedBtn");
const filterButtons = document.querySelectorAll(".filter-btn");
const STORAGE_KEY = "cloudTaskTasks";
let currentFilter = "all";

function loadTasks() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved !== null) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed)) {
        return parsed.map(task => ({
          id: task.id ?? Date.now() + Math.random(),
          text: String(task.text ?? ""),
          completed: Boolean(task.completed),
          priority: ["baja", "media", "alta"].includes(task.priority) ? task.priority : "media",
          dueDate: task.dueDate || ""
        }));
      }
    }
  } catch (error) {
    console.warn("No se pudieron leer las tareas guardadas.", error);
  }
  return [
    { id: 1, text: "Subir proyecto a GitHub", completed: false, priority: "alta" },
    { id: 2, text: "Desplegar aplicación en Vercel", completed: false, priority: "media" },
    { id: 3, text: "Probar aplicación desde el teléfono", completed: true, priority: "baja" }
  ];
}
let tasks = loadTasks();

function saveTasks() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch (error) {
    console.warn("No se pudieron guardar las tareas en este navegador.", error);
  }
}
function renderTasks() {
  taskList.replaceChildren();
  const filteredTasks = tasks.filter(task => {
    if (currentFilter === "pending") return !task.completed;
    if (currentFilter === "completed") return task.completed;
    return true;
  });
  if (filteredTasks.length === 0) {
    const empty = document.createElement("li");
    empty.className = "empty";
    empty.textContent = "No hay tareas para mostrar";
    taskList.appendChild(empty);
  }
  filteredTasks.forEach(task => {
    const li = document.createElement("li");
    li.className = "task" + (task.completed ? " completed" : "");
    const left = document.createElement("div");
    left.className = "task-left";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.completed;
    checkbox.setAttribute("aria-label", "Marcar tarea como completada");
    checkbox.addEventListener("change", () => toggleTask(task.id));
    const info = document.createElement("div");
    info.className = "task-info";
    const text = document.createElement("span");
    text.className = "task-text";
    text.textContent = task.text;
    const meta = document.createElement("div");
    meta.className = "meta";
    const priority = document.createElement("span");
    priority.className = `priority priority-${task.priority}`;
    const priorityNames = { baja: "Baja", media: "Media", alta: "Alta" };
    priority.textContent = `Prioridad ${priorityNames[task.priority] || "Media"}`;
    meta.appendChild(priority);
    info.append(text, meta);
    left.append(checkbox, info);
    const del = document.createElement("button");
    del.className = "delete-btn";
    del.type = "button";
    del.textContent = "Eliminar";
    del.addEventListener("click", () => deleteTask(task.id));
    li.append(left, del);
    taskList.appendChild(li);
  });
  updateCounters();
  saveTasks();
}
function addTask() {
  const text = taskInput.value.trim();
  if (!text) {
    alert("Escribe una tarea antes de agregarla.");
    taskInput.focus();
    return;
  }
  tasks.push({ id: Date.now(), text, completed: false, priority: prioritySelect.value });
  taskInput.value = "";
  prioritySelect.value = "media";
  renderTasks();
  taskInput.focus();
}
function toggleTask(id) {
  tasks = tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task);
  renderTasks();
}
function deleteTask(id) {
  tasks = tasks.filter(task => task.id !== id);
  renderTasks();
}
function clearCompletedTasks() {
  if (!tasks.some(task => task.completed)) {
    alert("No hay tareas completadas.");
    return;
  }
  if (confirm("¿Eliminar todas las tareas completadas?")) {
    tasks = tasks.filter(task => !task.completed);
    renderTasks();
  }
}
function updateCounters() {
  totalCount.textContent = tasks.length;
  pendingCount.textContent = tasks.filter(task => !task.completed).length;
}

addTaskBtn.addEventListener("click", addTask);
taskInput.addEventListener("keydown", event => {
  if (event.key === "Enter") addTask();
});
clearCompletedBtn.addEventListener("click", clearCompletedTasks);
filterButtons.forEach(button => {
  button.addEventListener("click", () => {
    filterButtons.forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");
    currentFilter = button.dataset.filter;
    renderTasks();
  });
});
renderTasks();
</script>
</body>
</html>
